[package]
name = "demand-sv2-connection"
version = "0.0.8"
authors = ["fi3 <email@email.org>"]
edition = "2021"
description = "Networking utils for SV2 roles"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stratum-mining/stratum"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
binary_sv2 = "=7.0.0"
framing_sv2 = "=8.0.0"
codec_sv2 = { version = "=7.0.0", features = ["noise_sv2", "with_buffer_pool"] }
noise_sv2 = "=2.0.0"
roles_logic_sv2 = { git = "https://github.com/dmnd-pool/roles-logic", rev = "95839819d259fedf80d69cbfba5eab4f7857c206" }
