[package]
name = "dmnd-client"
version = "0.3.30"
edition = "2021"

[lib]
name = "dmnd_client"
path = "src/lib.rs"

[[bin]]
name = "dmnd-client"
path = "src/main.rs"

[features]
default = ["jemalloc"]
jemalloc = ["jemallocator"]
mining-e2e = []

[[test]]
name = "mining_e2e"
path = "tests/mining_e2e.rs"
required-features = ["mining-e2e"]

[dependencies]
dashmap = {version = "6.1.0", features = ["inline"]}
bitcoin = {version = "0.32.5", features = ["serde","rand"]}
serde_json = { version = "1.0.64", default-features = false, features = ["alloc"] }
tokio-util = { version = "*", features = ["codec"] }
nohash-hasher = "*"
futures = "*"
async-recursion = "1.0.0"
lazy_static = "1.4.0"
rand = "0.8.4"
tracing = { version = "0.1" }
tracing-subscriber = { version = "*", features = ["env-filter"]}
tokio = {version="^1.36.0",features = ["full","tracing", "macros","rt-multi-thread"]}
key-utils = "1.0.0"
pid = { version = "4.0.0"}
clap = {version = "4.5.31", features = ["derive"]}
axum = {version = "0.8.1"}
serde = { version = "1.0.219", features = ["derive"] }  
sysinfo = {version = "0.33.1"}
primitive-types = { version = "0.13.1" }
toml ={ version = "0.8.22" }
self_update = {version = "0.42.0", features = ["archive-tar"]}
reqwest ={ version = "0.12.20"}
tracing-appender = "0.2.4"
minisign-verify = "0.2.5"

roles_logic_sv2 = { git = "https://github.com/dmnd-pool/roles-logic", rev = "95839819d259fedf80d69cbfba5eab4f7857c206" }
binary_sv2 = "=7.0.0"
framing_sv2 = "=8.0.0"
sv1_api = "=6.0.0"
demand-share-accounting-ext = { path = "vendor/share-accounting-ext" }
demand-sv2-connection = { path = "vendor/demand-sv2-connection" }

rust-embed = "8.7.2"
mime_guess = "2.0.5"

[dev-dependencies]
rand = "0.8.5"
sha2 = "0.10.8"
tempfile = "3.26.0"
integration_tests_sv2 = { git = "https://github.com/stratum-mining/sv2-apps.git", branch = "main" }
stratum-apps = { git = "https://github.com/stratum-mining/sv2-apps.git", branch = "main" }

[build-dependencies]
toml = "0.8.22"

[patch.crates-io]
binary_sv2 = { path = "vendor/binary-sv2" }

[profile.release]
strip = true
lto = true
panic = 'abort'

[profile.dev]
panic = 'abort'

[target.'cfg(not(target_os = "windows"))'.dependencies]
jemallocator = { version = "*", optional = true }
