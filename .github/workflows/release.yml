name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: cargo_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: Cargo.toml
          field: package.version

      - name: Fail if tag does not match Cargo.toml version
        run: |
          expected="v${{ steps.cargo_version.outputs.value }}"
          actual="${{ github.ref_name }}"
          [ "$expected" = "$actual" ] || {
            echo "Version mismatch: release tag '$actual' does not match cargo.toml version '$expected'."
            exit 1
          }

      - name: Validate release public key
        shell: bash
        run: |
          public_key="$(tail -n 1 release-signing.pub)"
          if [[ ! "$public_key" =~ ^RW[A-Za-z0-9+/]{54}$ ]]; then
            echo "release-signing.pub does not contain a valid release public key."
            exit 1
          fi

  build-linux:
    name: Build Linux Binary
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux Binary
        run: cargo build --release

      - name: Rename Linux Binary
        run: mv target/release/dmnd-client dmnd-client-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: dmnd-client-linux

  build-macos:
    name: Build macOS Binary
    needs: [version-check]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS Binary
        run: cargo build --release

      - name: Rename macOS Binary
        run: mv target/release/dmnd-client dmnd-client-macos

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: dmnd-client-macos

  build-windows:
    name: Build Windows Binary
    needs: [version-check]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Binary
        run: cargo build --release

      - name: Rename Windows Binary
        run: move target\release\dmnd-client.exe dmnd-client-windows.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dmnd-client-windows.exe

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: .

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact
          path: .

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: .

      - name: Install release signing tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign

      - name: Sign release binaries
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/release-signing.key"
          public_key_file="$RUNNER_TEMP/release-signing.pub"
          trap 'rm -f "$key_file" "$public_key_file"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"

          minisign -R -s "$key_file" -p "$public_key_file"
          derived_public_key="$(tail -n 1 "$public_key_file")"
          committed_public_key="$(tail -n 1 release-signing.pub)"
          if [[ "$derived_public_key" != "$committed_public_key" ]]; then
            echo "RELEASE_SIGNING_KEY does not match release-signing.pub."
            exit 1
          fi

          for binary in \
            dmnd-client-linux \
            dmnd-client-macos \
            dmnd-client-windows.exe
          do
            minisign -S -W \
              -s "$key_file" \
              -m "$binary" \
              -x "$binary.minisig" \
              -t "dmnd-client ${GITHUB_REF_NAME#v} $binary"
          done

      - name: Verify release signatures
        shell: bash
        run: |
          for binary in \
            dmnd-client-linux \
            dmnd-client-macos \
            dmnd-client-windows.exe
          do
            minisign -V \
              -p release-signing.pub \
              -m "$binary" \
              -x "$binary.minisig"
          done

      - name: Generate SHA-256 checksums
        run: |
          sha256sum \
            dmnd-client-linux \
            dmnd-client-macos \
            dmnd-client-windows.exe \
            > sha256-checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dmnd-client-linux
            dmnd-client-linux.minisig
            dmnd-client-macos
            dmnd-client-macos.minisig
            dmnd-client-windows.exe
            dmnd-client-windows.exe.minisig
            sha256-checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
